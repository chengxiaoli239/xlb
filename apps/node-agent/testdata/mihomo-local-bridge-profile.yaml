mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: global
log-level: warning
proxies:
  - name: XLB proof bridge
    type: socks5
    server: 127.0.0.1
    port: 17890
    udp: false
proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - XLB proof bridge
rules:
  - MATCH,GLOBAL
