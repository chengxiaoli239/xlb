import org.cyclonedx.gradle.CyclonedxDirectTask
import org.cyclonedx.model.Component

plugins {
    id 'org.cyclonedx.bom' version '3.6.1'
}

group = 'com.xlb.vpn'
version = '0.2.15'

apply plugin: 'com.android.application'

tasks.named('cyclonedxDirectBom', CyclonedxDirectTask) {
    projectType = Component.Type.APPLICATION
    includeConfigs = ['releaseRuntimeClasspath']
    testConfigs = []
}

android {
    namespace 'com.xlb.vpn'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.xlb.vpn'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.2.15'
        buildConfigField 'String', 'API_BASE_URL', '"https://api.xlb.invalid"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'API_BASE_URL', '"http://127.0.0.1:4175"'
            manifestPlaceholders = [usesCleartextTraffic: true]
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [usesCleartextTraffic: false]
        }
    }

    sourceSets {
        debug {
            jniLibs.srcDirs += ["$buildDir/generated/mihomo/debug"]
        }
        release {
            jniLibs.srcDirs += ["$buildDir/generated/mihomo/release"]
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def goCoreDir = file('../core-native')
def ndkPrebuiltDir = file("${android.sdkDirectory}/ndk/${android.ndkVersion}/toolchains/llvm/prebuilt")
def ndkCompilerName = 'aarch64-linux-android26-clang'
def ndkHostTag
if (System.getProperty('os.name').toLowerCase().contains('mac')) {
    def macHostTags = System.getProperty('os.arch') == 'aarch64'
        ? ['darwin-arm64', 'darwin-x86_64']
        : ['darwin-x86_64']
    ndkHostTag = macHostTags.find { hostTag ->
        new File(ndkPrebuiltDir, "${hostTag}/bin/${ndkCompilerName}").canExecute()
    }
    if (ndkHostTag == null) {
        throw new GradleException("No usable macOS NDK compiler found under ${ndkPrebuiltDir}")
    }
} else if (System.getProperty('os.name').toLowerCase().contains('linux') && System.getProperty('os.arch') == 'amd64') {
    ndkHostTag = 'linux-x86_64'
} else {
    throw new GradleException("Unsupported NDK host: ${System.getProperty('os.name')} ${System.getProperty('os.arch')}")
}
def ndkBin = new File(ndkPrebuiltDir, "${ndkHostTag}/bin")
def registerMihomoArm64Build = { String variant, boolean includeTestSignerCallback ->
    def variantName = variant.capitalize()
    def outputDir = file("$buildDir/generated/mihomo/${variant}/arm64-v8a")
    def buildTags = includeTestSignerCallback
        ? 'with_gvisor,cmfa,xlb_android_test_callback'
        : 'with_gvisor,cmfa'
    tasks.register("buildMihomoArm64${variantName}", Exec) {
        workingDir goCoreDir
        outputs.file(file("$outputDir/libxlbcore.so"))
        inputs.files(fileTree(goCoreDir) { include '*.go', '*.c', '*.h', 'go.mod', 'go.sum' })
        inputs.property('testSignerCallbackEnabled', includeTestSignerCallback)
        doFirst { outputDir.mkdirs() }
        environment 'CGO_ENABLED', '1'
        environment 'GOOS', 'android'
        environment 'GOARCH', 'arm64'
        environment 'CC', new File(ndkBin, ndkCompilerName).absolutePath
        environment 'CGO_CFLAGS', includeTestSignerCallback ? '-DXLB_ANDROID_TEST_SIGNER_CALLBACK' : ''
        commandLine 'go', 'build', '-trimpath', '-buildmode=c-shared', "-tags=${buildTags}",
                '-o', file("$outputDir/libxlbcore.so"), '.'
    }
}

def debugCoreBuild = registerMihomoArm64Build('debug', true)
def releaseCoreBuild = registerMihomoArm64Build('release', false)
tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn(debugCoreBuild) }
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn(releaseCoreBuild) }

tasks.matching { it.name in ['connectedDebugAndroidTest', 'installDebugAndroidTest'] }.configureEach {
    doFirst {
        def serial = project.findProperty('xlbDisposableAvdSerial')?.toString()?.trim()
        if (!serial) {
            throw new GradleException('Set -PxlbDisposableAvdSerial to the dedicated xlb-m9-recovery emulator serial.')
        }

        def guard = rootProject.file('scripts/validate-disposable-avd.sh')
        def process = new ProcessBuilder('bash', guard.absolutePath, serial)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8')
        if (process.waitFor() != 0) {
            throw new GradleException(output.trim())
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
