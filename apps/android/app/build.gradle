apply plugin: 'com.android.application'

android {
    namespace 'com.xlb.vpn'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xlb.vpn'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'API_BASE_URL', '"https://api.xlb.invalid"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'API_BASE_URL', '"http://127.0.0.1:4175"'
            manifestPlaceholders = [usesCleartextTraffic: true]
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [usesCleartextTraffic: false]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
