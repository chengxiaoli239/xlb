[package]
name = "xlb-windows-account-shell"
version = "0.1.0"
description = "XLB Windows account shell"
authors = ["XLB"]
edition = "2021"

[lib]
name = "xlb_windows_account_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
zeroize = "1.8"
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
