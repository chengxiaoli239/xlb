name: Android signed release candidate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Approval or issue reference for this candidate build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-candidate:
    name: Build and attest signed Android candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release-candidate
    permissions:
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install pinned Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'

      - name: Set up Go for Mihomo JNI
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.24.0'
          cache-dependency-path: apps/android/core-native/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.XLB_ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          keystore_path="$RUNNER_TEMP/xlb-android-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"
          echo "XLB_ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release candidate
        working-directory: apps/android
        env:
          XLB_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.XLB_ANDROID_RELEASE_STORE_PASSWORD }}
          XLB_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.XLB_ANDROID_RELEASE_KEY_ALIAS }}
          XLB_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.XLB_ANDROID_RELEASE_KEY_PASSWORD }}
          XLB_ANDROID_RELEASE_API_BASE_URL: ${{ vars.XLB_ANDROID_RELEASE_API_BASE_URL }}
        run: |
          ./gradlew --no-daemon -PxlbRequireReleaseSigning=true :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease

      - name: Verify package identity and APK signature
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          android_build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$android_build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$android_build_tools/aapt" dump badging "$apk" | sed -n '1,4p'
          "$android_build_tools/aapt" dump badging "$apk" | grep -F "package: name='com.xlb.vpn'"
          "$android_build_tools/aapt" dump badging "$apk" | grep -F "uses-permission: name='android.permission.INTERNET'"

      - name: Generate release runtime SBOM
        working-directory: apps/android
        run: ./gradlew :app:cyclonedxDirectBom --no-daemon

      - name: Create source-bound APK manifest
        run: |
          python3 ops/build_artifact_manifest.py \
            --output apps/android/app/build/outputs/apk/release/build-manifest.json \
            apps/android/app/build/outputs/apk/release/app-release.apk \
            apps/android/app/build/reports/cyclonedx-direct/bom.json
          printf 'Candidate reason: %s\nSource commit: %s\n' "$CANDIDATE_REASON" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat apps/android/app/build/outputs/apk/release/build-manifest.json >> "$GITHUB_STEP_SUMMARY"
        env:
          CANDIDATE_REASON: ${{ inputs.reason }}

      - name: Verify candidate artifact manifest
        run: python3 ops/verify_artifact_manifest.py apps/android/app/build/outputs/apk/release/build-manifest.json

      - name: Attest signed candidate APK
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: apps/android/app/build/outputs/apk/release/app-release.apk
          push-to-registry: false
          create-storage-record: false

      - name: Attest release runtime SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: apps/android/app/build/reports/cyclonedx-direct/bom.json
          push-to-registry: false
          create-storage-record: false

      - name: Upload signed candidate for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xlb-android-signed-release-candidate-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/build-manifest.json
            apps/android/app/build/reports/cyclonedx-direct/bom.json
          if-no-files-found: error
          retention-days: 14
