name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate source and lockfile SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          syft-version: v1.57.2
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/xlb-vpn-source.cdx.json
          artifact-name: xlb-vpn-source-sbom
          upload-artifact: true
          upload-artifact-retention: 7
          upload-release-assets: false
          dependency-snapshot: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm build

      - name: Build API TypeScript
        run: pnpm --filter @xlb/api build

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter @xlb/api test

      - name: Run web account tests
        run: pnpm --filter @xlb/web test

      - name: Run extension tests
        working-directory: apps/extension
        run: node --test

      - name: Set up Go for PHP-to-Node-Agent probe integration test
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/node-agent/go.mod
          cache-dependency-path: apps/node-agent/go.sum

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install PHP dependencies
        working-directory: apps/php-api
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel tests
        run: pnpm test
        env:
          # Deterministic test-only encryption key; never used by an app runtime.
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  node-agent:
    name: Isolated node agent tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/node-agent/go.mod
          cache-dependency-path: apps/node-agent/go.sum

      - name: Test concurrent peer state and bridge
        working-directory: apps/node-agent
        run: go test -race ./...

      - name: Vet and build isolated executables
        working-directory: apps/node-agent
        run: |
          go vet ./...
          go build ./...

  operations:
    name: Offline node operations safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test operation plans with mocked cloud calls
        run: python3 -m unittest discover -s ops -p 'test_*.py'

  android:
    name: Android native build, JVM tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'

      - name: Set up Go for Mihomo JNI
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: apps/android/core-native/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK, compile instrumentation tests, run JVM tests and lint
        working-directory: apps/android
        run: ./gradlew assembleDebug testDebugUnitTest compileDebugAndroidTestJavaWithJavac lintDebug --no-daemon

      - name: Generate resolved Android release runtime SBOM
        working-directory: apps/android
        run: ./gradlew :app:cyclonedxDirectBom --no-daemon

      - name: Upload resolved Android release runtime SBOM
        uses: actions/upload-artifact@v4
        with:
          name: xlb-android-release-runtime-cyclonedx
          path: apps/android/app/build/reports/cyclonedx-direct/bom.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate checksummed debug APK manifest
        run: |
          python3 ops/build_artifact_manifest.py \
            --output apps/android/app/build/outputs/apk/debug/build-manifest.json \
            apps/android/app/build/outputs/apk/debug/app-debug.apk
          cat apps/android/app/build/outputs/apk/debug/build-manifest.json >> "$GITHUB_STEP_SUMMARY"
