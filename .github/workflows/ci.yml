name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate source and lockfile SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          syft-version: v1.57.2
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/xlb-vpn-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload attested source SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xlb-vpn-source-sbom
          path: ${{ runner.temp }}/xlb-vpn-source.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm build

      - name: Build API TypeScript
        run: pnpm --filter @xlb/api build

      - name: Build PHP and Web container images
        run: |
          python3 ops/test_docker_context.py
          docker build --file docker/Dockerfile.php --tag xlb-php:ci .
          docker build --file docker/Dockerfile.web --tag xlb-web:ci .

      - name: Smoke test built PHP and Web containers
        shell: bash
        run: |
          set -euo pipefail
          php_container_id=""
          web_container_id=""
          cleanup() {
            if [[ -n "$php_container_id" ]]; then
              docker stop "$php_container_id" >/dev/null || true
            fi
            if [[ -n "$web_container_id" ]]; then
              docker stop "$web_container_id" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          web_container_id="$(docker run --detach --rm --publish 127.0.0.1::80 xlb-web:ci)"
          php_container_id="$(docker run --detach --rm --publish 127.0.0.1::8000 xlb-php:ci)"
          web_address="$(docker port "$web_container_id" 80/tcp)"
          php_address="$(docker port "$php_container_id" 8000/tcp)"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 3 --output /dev/null --write-out 'Web container returned HTTP %{http_code}\n' \
            "http://${web_address}/"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 3 --output /dev/null --write-out 'PHP container returned HTTP %{http_code}\n' \
            "http://${php_address}/up"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter @xlb/api test

      - name: Run web account tests
        run: pnpm --filter @xlb/web test

      - name: Run extension tests
        working-directory: apps/extension
        run: node --test

      - name: Set up Go for PHP-to-Node-Agent probe integration test
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/node-agent/go.mod
          cache-dependency-path: |
            apps/node-agent/go.sum
            apps/android/core-native/go.sum

      - name: Build the pinned Mihomo profile parser
        working-directory: apps/android/core-native
        run: |
          mihomo_version=$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)
          go mod download "github.com/metacubex/mihomo@${mihomo_version}"
          mihomo_dir="$(go env GOMODCACHE)/github.com/metacubex/mihomo@${mihomo_version}"
          mkdir -p "$RUNNER_TEMP/mihomo-bin"
          (cd "$mihomo_dir" && go build -o "$RUNNER_TEMP/mihomo-bin/mihomo" .)
          echo "XLB_MIHOMO_BINARY=$RUNNER_TEMP/mihomo-bin/mihomo" >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install PHP dependencies
        working-directory: apps/php-api
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel tests
        run: pnpm test
        env:
          # Deterministic test-only encryption key; never used by an app runtime.
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  node-agent:
    name: Isolated node agent tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/node-agent/go.mod
          cache-dependency-path: |
            apps/node-agent/go.sum
            apps/android/core-native/go.sum

      - name: Test Android proof bridge against isolated Node Agent
        working-directory: apps/android/core-native
        run: go test -race ./internal/proofbridge ./internal/debugprofile

      - name: Test concurrent peer state and bridge
        working-directory: apps/node-agent
        run: go test -race ./...

      - name: Vet and build isolated executables
        working-directory: apps/node-agent
        run: |
          go vet ./...
          go build ./...

  operations:
    name: Offline node operations safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Test operation plans with mocked cloud calls
        run: python3 -m unittest discover -s ops -p 'test_*.py'

  android:
    name: Android native build, JVM tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install pinned Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'

      - name: Set up Go for Mihomo JNI
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.24.0'
          cache-dependency-path: apps/android/core-native/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build debug APK, compile instrumentation tests, run JVM tests and lint
        working-directory: apps/android
        run: ./gradlew assembleDebug testDebugUnitTest compileDebugAndroidTestJavaWithJavac lintDebug --no-daemon

      - name: Verify release signing configuration with ephemeral test key
        run: apps/android/scripts/verify-release-signing-config.sh

      - name: Generate resolved Android release runtime SBOM
        working-directory: apps/android
        run: ./gradlew :app:cyclonedxDirectBom --no-daemon

      - name: Upload resolved Android release runtime SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xlb-android-release-runtime-cyclonedx
          path: apps/android/app/build/reports/cyclonedx-direct/bom.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate checksummed debug APK manifest
        run: |
          python3 ops/build_artifact_manifest.py \
            --output apps/android/app/build/outputs/apk/debug/build-manifest.json \
            apps/android/app/build/outputs/apk/debug/app-debug.apk
          cat apps/android/app/build/outputs/apk/debug/build-manifest.json >> "$GITHUB_STEP_SUMMARY"

  sbom-attestations:
    name: SBOM provenance attestations
    runs-on: ubuntu-latest
    needs: [checks, tests, node-agent, operations, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Download source SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xlb-vpn-source-sbom
          path: ${{ runner.temp }}/sboms/source

      - name: Download Android runtime SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xlb-android-release-runtime-cyclonedx
          path: ${{ runner.temp }}/sboms/android

      - name: Attest source SBOM provenance
        id: attest_source_sbom
        continue-on-error: true
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/sboms/source/xlb-vpn-source.cdx.json
          push-to-registry: false
          create-storage-record: false

      - name: Wait before retrying source SBOM provenance
        if: steps.attest_source_sbom.outcome == 'failure'
        run: sleep 30

      - name: Retry source SBOM provenance
        if: steps.attest_source_sbom.outcome == 'failure'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/sboms/source/xlb-vpn-source.cdx.json
          push-to-registry: false
          create-storage-record: false

      - name: Attest Android runtime SBOM provenance
        id: attest_android_sbom
        continue-on-error: true
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/sboms/android/bom.json
          push-to-registry: false
          create-storage-record: false

      - name: Wait before retrying Android SBOM provenance
        if: steps.attest_android_sbom.outcome == 'failure'
        run: sleep 30

      - name: Retry Android SBOM provenance
        if: steps.attest_android_sbom.outcome == 'failure'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/sboms/android/bom.json
          push-to-registry: false
          create-storage-record: false
